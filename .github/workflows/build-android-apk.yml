name: Build Android APK

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # apps/mobile/app.json's version is kept in sync with patchNotes.js by
      # the repo's husky pre-commit hook (scripts/sync-version-from-patch-notes.js),
      # so this just reads whatever is already there — no deriving, validating,
      # or bumping in CI.
      - name: Read app version
        id: version
        run: |
          VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Requires EXPO_TOKEN in repo secrets (Settings > Secrets and variables > Actions).
      # Generate one at https://expo.dev/settings/access-tokens
      - name: Build Android APK via EAS
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait --json > eas-output.json

      - name: Extract APK download URL
        id: extract_url
        working-directory: apps/mobile
        run: |
          URL=$(node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('eas-output.json', 'utf8'));
            const build = Array.isArray(data) ? data[0] : data;
            const url = build && build.artifacts && build.artifacts.buildUrl;
            if (!url) { console.error('No buildUrl found in EAS build output:'); console.error(JSON.stringify(build, null, 2)); process.exit(1); }
            console.log(url);
          ")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download APK
        working-directory: apps/mobile
        run: curl -fL -o barrow.apk "${{ steps.extract_url.outputs.url }}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mobile-v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" apps/mobile/barrow.apk --clobber
          else
            gh release create "$TAG" apps/mobile/barrow.apk \
              --title "Barrow Android v${{ steps.version.outputs.version }}" \
              --notes "Automated Android build from commit ${{ github.sha }}."
          fi

      # Lets useAppVersionCheck.js (apps/mobile) prompt anyone on an older
      # installed build to update, once this one's release is actually up.
      # Uses the service_role key (bypasses the `app_config` table's RLS,
      # which only grants clients read access) — requires a
      # SUPABASE_SERVICE_ROLE_KEY repo secret (Settings > Secrets and
      # variables > Actions), copied from the Supabase dashboard's Project
      # Settings > API > service_role key. The project URL itself isn't
      # secret — it's already embedded in the app bundle via
      # EXPO_PUBLIC_SUPABASE_URL (see apps/mobile/eas.json).
      - name: Update current app version in Supabase
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sf -X POST "https://sjbqvellgvxfwxlzwedr.supabase.co/rest/v1/app_config" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{\"id\": true, \"mobile_version\": \"${{ steps.version.outputs.version }}\"}"
